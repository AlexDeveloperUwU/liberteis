services:
  # Database service
  mysql:
    image: mysql:9.2.0
    container_name: liberteis-db
    ports:
      - "3306:3306"
    env_file:
      - ./data/secrets/dbcreds.env
    volumes:
      - ./data/secrets/dbcreds.env:/run/secrets/dbcreds.env:ro 
      - data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: ["mysqld", "--bind-address=0.0.0.0"]
    environment:
      - MYSQL_ROOT_PASSWORD
      - MYSQL_DATABASE
      - MYSQL_USER
      - MYSQL_PASSWORD
      - MYSQL_HOST

  # Only dev service
  liberteis-dev:
    image: alexdeveloperuwu/liberteis
    container_name: liberteis-dev
    depends_on:
      mysql:
        condition: service_healthy
    build:
      context: .
    ports:
      - "3000:3000"
    profiles:
      - dev
    environment:
      - MYSQL_HOST
      - MYSQL_USER
      - MYSQL_PASSWORD
      - MYSQL_DATABASE
    volumes:
      - ./data:/app/data
      - ./data/secrets:/app/secrets
      - ./data/logs:/app/logs 

  # Only prod service
  liberteis-prod:
    image: ghcr.io/alexdeveloperuwu/liberteis
    container_name: liberteis-prod
    depends_on:
      mysql:
        condition: service_healthy
    build:
      context: .
    ports:
      - "3000:3000"
    profiles:
      - prod
    environment:
      - MYSQL_HOST
      - MYSQL_USER
      - MYSQL_PASSWORD
      - MYSQL_DATABASE
    volumes:
      - ./data:/app/data
      - ./data/secrets:/app/secrets
      - ./data/logs:/app/logs

volumes:
  data:

networks:
  default:
    name: liberteis-net
