<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EvenTeis</title>
    <link href="/src/assets/main.css" rel="stylesheet" />
    <style>
      #preloader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #1e2939;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        transition: opacity 0.5s ease;
      }

      .loader {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        display: block;
        margin: 15px auto;
        position: relative;
        color: #fff;
        box-sizing: border-box;
        animation: animloader 1s linear infinite alternate;
      }

      @keyframes animloader {
        0% {
          box-shadow:
            -38px -6px,
            -14px 6px,
            14px -6px;
        }

        33% {
          box-shadow:
            -38px 6px,
            -14px -6px,
            14px 6px;
        }

        66% {
          box-shadow:
            -38px -6px,
            -14px 6px,
            14px -6px;
        }

        100% {
          box-shadow:
            -38px 6px,
            -14px -6px,
            14px 6px;
        }
      }
    </style>
  </head>

  <body>
    <div id="preloader">
      <div class="loader"></div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
    <script>
      window.addEventListener("load", () => {
        const preloader = document.getElementById("preloader");
        if (preloader) {
          setTimeout(() => {
            preloader.style.opacity = "0";
            setTimeout(() => {
              preloader.style.display = "none";
            }, 500);
          }, 1400);
        }
      });
    </script>
  </body>
</html>
