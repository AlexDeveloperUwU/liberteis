<!doctype html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{product_name}}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=K2D:wght@600;700&family=Lexend:wght@400;500;600;700&display=swap" />
  </head>
  <body style="margin: 0; padding: 0; background-color: #efefe9; font-family: &quot;Lexend&quot;, Arial, sans-serif">
    <div style="display: none; max-height: 0; overflow: hidden; opacity: 0">{{preview_text}}</div>
    <table
      role="presentation"
      cellpadding="0"
      cellspacing="0"
      border="0"
      width="100%"
      style="background-color: #efefe9">
      <tr>
        <td align="center" style="padding: 40px 16px">
          <table
            role="presentation"
            cellpadding="0"
            cellspacing="0"
            border="0"
            width="560"
            style="max-width: 560px; width: 100%">
            <tr>
              <td align="center" style="padding-bottom: 24px">
                <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                  <tr>
                    <td width="28" height="28" align="center" valign="middle">
                      <img
                        src="cid:brandIcon"
                        width="28"
                        height="28"
                        alt="{{product_name}}"
                        style="display: block; border-radius: 8px" />
                    </td>
                    <td
                      valign="middle"
                      style="
                        padding-left: 8px;
                        font-family: &quot;K2D&quot;, Arial, sans-serif;
                        font-size: 15px;
                        font-weight: 600;
                        color: #121416;
                      ">
                      {{product_name}}
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td>
                <table
                  role="presentation"
                  cellpadding="0"
                  cellspacing="0"
                  border="0"
                  width="100%"
                  style="background-color: #f5f5f2; border: 1.5px solid #e8e8e0; border-radius: 8px">
                  <tr>
                    <td style="padding: 16px 24px; border-bottom: 1.5px solid #e8e8e0">
                      <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                        <tr>
                          <td valign="middle">
                            <img src="cid:titleIcon" width="20" height="20" alt="" style="display: block" />
                          </td>
                          <td
                            valign="middle"
                            style="
                              padding-left: 10px;
                              font-family: &quot;K2D&quot;, Arial, sans-serif;
                              font-size: 20px;
                              font-weight: 700;
                              color: #121416;
                            ">
                            {{title}}
                          </td>
                        </tr>
                      </table>
                    </td>
                  </tr>
                  <tr>
                    <td
                      style="
                        padding: 24px;
                        font-family: &quot;Lexend&quot;, Arial, sans-serif;
                        font-size: 16px;
                        line-height: 1.6;
                        color: #343a40;
                      ">
                      {{body_html}} {{info_section}}
                    </td>
                  </tr>
                  <tr>
                    <td align="right" style="padding: 16px 24px; border-top: 1.5px solid #e8e8e0">
                      <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                        <tr>
                          <td align="center" bgcolor="{{accent_color}}" style="border-radius: 8px">
                            <a
                              href="{{button_url}}"
                              target="_blank"
                              style="
                                display: inline-block;
                                padding: 11px 24px;
                                font-family: &quot;Lexend&quot;, Arial, sans-serif;
                                font-size: 14px;
                                font-weight: 500;
                                color: #ffffff;
                                text-decoration: none;
                                border-radius: 8px;
                              "
                              >{{button_label}}</a
                            >
                          </td>
                        </tr>
                      </table>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
